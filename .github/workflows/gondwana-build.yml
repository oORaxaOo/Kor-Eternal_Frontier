name: Gondwana prototype

on:
  push:
    branches: [main, gondwana-kor-foundation]
    paths:
      - "GondwanaGame/**"
      - "GondwanaGame.Tests/**"
      - ".github/workflows/gondwana-build.yml"
  pull_request:
    paths:
      - "GondwanaGame/**"
      - "GondwanaGame.Tests/**"
      - ".github/workflows/gondwana-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Show .NET SDK
        run: dotnet --info
      - name: Restore game
        run: dotnet restore GondwanaGame/KorFrontier.Gondwana.csproj --nologo
      - name: Build game
        run: dotnet build GondwanaGame/KorFrontier.Gondwana.csproj --configuration Release --no-restore --nologo
      - name: Restore tests
        run: dotnet restore GondwanaGame.Tests/KorFrontier.Tests.csproj --nologo
      - name: Run simulation tests
        run: dotnet test GondwanaGame.Tests/KorFrontier.Tests.csproj --configuration Release --no-restore --nologo
