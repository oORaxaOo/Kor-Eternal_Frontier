name: Kor Eternal Frontier validation

on:
  push:
    branches:
      - main
      - rebuild/kor-foundation-cleanup
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/gondwana-game.yml"
      - "*.md"
      - ".gitignore"
      - "build-linux.sh"
      - "launch-kor.sh"
  pull_request:
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/gondwana-game.yml"
      - "*.md"
      - ".gitignore"
      - "build-linux.sh"
      - "launch-kor.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build canonical root project
        run: dotnet build GondwanaGame.csproj --configuration Release

      - name: Run colony and campaign checks
        run: dotnet run --project GondwanaGame.csproj --configuration Release --no-build -- --self-test

      - name: Publish self-contained Linux x86_64 build
        run: dotnet publish GondwanaGame.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/Kor-Eternal-Frontier/linux-x64

      - name: Verify published executable
        run: |
          test -f artifacts/Kor-Eternal-Frontier/linux-x64/GondwanaGame
          file artifacts/Kor-Eternal-Frontier/linux-x64/GondwanaGame

      - name: Upload downloadable Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Kor-Eternal-Frontier-linux-x64
          path: artifacts/Kor-Eternal-Frontier/linux-x64/
          if-no-files-found: error
          retention-days: 14
