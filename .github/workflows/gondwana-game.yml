name: Kor Eternal Frontier validation

# Pushes and pull_request synchronize events target the same branch. Keep only one
# expensive SDL build/package job per branch so duplicate runs cannot starve the
# graphical startup checks or exhaust hosted-runner capacity.
concurrency:
  group: kor-eternal-frontier-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - rebuild/kor-foundation-cleanup
      - 'feature/**'
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/gondwana-game.yml"
      - "*.md"
      - ".gitignore"
      - "build-linux.sh"
      - "launch-kor.sh"
  pull_request:
    paths:
      - "**.cs"
      - "**.csproj"
      - ".github/workflows/gondwana-game.yml"
      - "*.md"
      - ".gitignore"
      - "build-linux.sh"
      - "launch-kor.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build canonical root project
        run: dotnet build GondwanaGame.csproj --configuration Release

      - name: Run simulation and unified-session checks
        run: dotnet run --project GondwanaGame.csproj --configuration Release --no-build -- --self-test

      - name: Capture UI comparison images at 1280x720 and 1920x1080
        run: dotnet run --project GondwanaGame.csproj --configuration Release --no-build -- --capture-ui-screenshots=artifacts/ui-screenshots

      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb cmake ninja-build build-essential git patchelf \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev

      - name: Build SDL3 runtime for graphical startup checks
        run: |
          git clone --depth 1 --branch release-3.4.2 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF \
            -DSDL_WAYLAND=OFF -DSDL_ALSA=OFF -DSDL_PULSEAUDIO=OFF \
            -DSDL_PIPEWIRE=OFF -DSDL_JACK=OFF -DSDL_SNDIO=OFF \
            -DSDL_KMSDRM=OFF -DSDL_VIVANTE=OFF -DSDL_X11_XTEST=OFF
          cmake --build /tmp/SDL/build --parallel 2
          cmake --install /tmp/SDL/build
          test -e /tmp/sdl3-install/lib/libSDL3.so

      - name: Publish self-contained Linux x86_64 build
        run: dotnet publish GondwanaGame.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/Kor-Eternal-Frontier/linux-x64

      - name: Bundle SDL3 and configure local native library lookup
        run: |
          cp -a /tmp/sdl3-install/lib/libSDL3.so* artifacts/Kor-Eternal-Frontier/linux-x64/
          patchelf --set-rpath '$ORIGIN' artifacts/Kor-Eternal-Frontier/linux-x64/GondwanaGame
          test -f artifacts/Kor-Eternal-Frontier/linux-x64/libSDL3.so
          cp launch-kor.sh artifacts/Kor-Eternal-Frontier/linux-x64/start-kor.sh
          cp README-LINUX.md artifacts/Kor-Eternal-Frontier/linux-x64/README-LINUX.md
          chmod +x artifacts/Kor-Eternal-Frontier/linux-x64/start-kor.sh

      - name: Validate Linux launch scripts
        run: bash -n launch-kor.sh build-linux.sh artifacts/Kor-Eternal-Frontier/linux-x64/start-kor.sh

      - name: Verify published executable
        run: |
          test -f artifacts/Kor-Eternal-Frontier/linux-x64/GondwanaGame
          file artifacts/Kor-Eternal-Frontier/linux-x64/GondwanaGame
          ldd artifacts/Kor-Eternal-Frontier/linux-x64/libSDL3.so

      - name: Smoke-test graphical startup at 1280x720
        env:
          SDL_VIDEODRIVER: x11
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' artifacts/Kor-Eternal-Frontier/linux-x64/start-kor.sh --smoke-test --window-size=1280x720

      - name: Smoke-test graphical startup at 1920x1080
        env:
          SDL_VIDEODRIVER: x11
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' artifacts/Kor-Eternal-Frontier/linux-x64/start-kor.sh --smoke-test --window-size=1920x1080

      - name: Upload UI comparison screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Kor-Eternal-Frontier-ui-comparison
          path: artifacts/ui-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload downloadable Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Kor-Eternal-Frontier-linux-x64
          path: artifacts/Kor-Eternal-Frontier/linux-x64/
          if-no-files-found: error
          retention-days: 14
